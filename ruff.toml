# Root-level Python (scripts/, .claude/hooks/, tests/): the workflow tooling.
# The backend keeps its own settings in backend/pyproject.toml, with the same rules.
line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "D"]
ignore = ["D105", "D107"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/**" = ["D"]
